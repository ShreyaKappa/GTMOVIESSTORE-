{% extends "base.html" %}
{% load static %}

{% block content %}
<h1 class="mb-4">Trending Movies in {{ region.name }}</h1>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>Movie Title</th>
            <th>Purchases</th>
            <th>Views</th>
        </tr>
    </thead>
    <tbody>
        {% for item in trending %}
        <tr>
            <td>{{ item.movie.name }}</td>
            <td>{{ item.purchases }}</td>
            <td>{{ item.views }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" class="text-center">No trending data yet.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="{% url 'popularity:map' %}" class="btn btn-primary mt-3">Back to Map</a>

{% endblock %}
